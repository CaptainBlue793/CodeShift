[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeshift"
version = "0.1.0"
description = "Multi-agent, behavior-preserving code migration (Python -> TypeScript, v1)."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "ollama>=0.3",
    "networkx>=3.0",
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "hypothesis>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.8"]

[project.scripts]
codeshift = "main:main"

[tool.setuptools.packages.find]
include = ["codeshift*"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
